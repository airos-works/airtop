# Builds the air/OS packages (x86_64 and arm64) on every push to main and publishes them to the
# rolling "latest" release; the image builds take them from the package pool. The pipeline lives
# in jmgasper/airos-ci (apps/build-app-packages.sh, build_airtop).
name: air/OS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  airos:
    uses: jmgasper/airos-ci/.github/workflows/app.yml@main
    with:
      app: airtop
      repo-dir: AirTop
    permissions:
      contents: write
